version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - gosec
  settings:
    gosec:
      excludes:
        - G204
        - G115
        - G306
        - G602
        - G702
        - G703
        - G301
        - G302
        - G304
        - G104
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
