version: "2"
run:
  timeout: 5m
linters:
  enable:
    - errcheck
    - staticcheck
    - govet
    - gosec
    - ineffassign
    - unused
  settings:
    gosec:
      excludes:
        - G204
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - web/frontend/node_modules
      # Hand-maintained SQL wrappers, not generated output. They carry no
      # "Code generated" header, so `generated: lax` cannot skip them and
      # they have to be excluded here by path. Hand fixes are permanent: there
      # is no codegen step that would erase them (see the header in sqlc.yaml).
      - internal/store/queries
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - web/frontend/node_modules
