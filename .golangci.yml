version: "2"
run:
  timeout: 5m
linters:
  enable:
    - errcheck
    - staticcheck
    - govet
    - gosec
    - ineffassign
    - unused
  settings:
    gosec:
      excludes:
        - G204
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - web/frontend/node_modules
      # sqlc output. It carries no "Code generated" header, so `generated: lax` cannot skip
      # it, and any hand fix here is erased by the next `make generate`.
      - internal/store/queries
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - web/frontend/node_modules
