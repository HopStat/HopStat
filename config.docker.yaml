server:
  host: "0.0.0.0"
  port: 8011
  mode: "server"
  tls_cert: ""
  tls_key: ""
  autocert_domain: ""
  behind_cloudflare: true
  trusted_proxies: []

database:
  path: "/app/data/lg.db"

security:
  jwt_secret: "${LG_JWT_SECRET}"
  credential_key: "${LG_CREDENTIAL_KEY}"

flood_control:
  enabled: true
  http_rate_limit_per_min: 100
  query_rate_limit_per_min: 100
  brute_force_max: 5
  brute_force_ban_min: 15

audit:
  retention_days: 90
  async_write: true

query:
  max_concurrent: 50
  default_timeout_sec: 30
  traceroute_timeout_sec: 60

geoip:
  asn_db_path: ""
  city_db_path: ""
  license_key: ""
  account_id: ""
  update_interval: "72h"
  db_dir: "/app/data/geoip"

update:
  enabled: true

bgp:
  listen_port: 11790
  router_id: ""
  local_as: 0
  listen_addresses: []
  add_path_receive: true
