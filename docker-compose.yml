services:
  hopstat:
    build: .
    # image: ghcr.io/hopstat/hopstat:latest   # use after first release is published
    ports:
      - "8080:8080"
    volumes:
      - hopstat-data:/data
    environment:
      # Set a known admin password on first start.
      # After logging in, change it in Admin → Users.
      LG_ADMIN_PASSWORD: ${LG_ADMIN_PASSWORD:-changeme}

      # Local dev: disable HTTP + query rate limits and brute-force protection.
      LG_FLOOD_CONTROL_ENABLED: "false"

      # Docker: self-update replaces the binary inside the image — use image pull instead.
      LG_UPDATE_ENABLED: "false"

      # Optional: pin secrets so they survive image rebuilds.
      # Leave unset to let HopStat generate them automatically on first start.
      # LG_SECURITY_JWT_SECRET: ""       # min 64 hex chars  (openssl rand -hex 32)
      # LG_SECURITY_CREDENTIAL_KEY: ""   # exactly 64 hex chars (openssl rand -hex 32)

      # GeoIP — MaxMind GeoLite2 ASN + City databases.
      # Get a free license key from https://www.maxmind.com/en/accounts/current/license-key
      # Uncomment and set both values to enable GeoIP lookups.
      # LG_GEOIP_LICENSE_KEY: "your-license-key"
      # LG_GEOIP_ACCOUNT_ID: "your-account-id"
    cap_add:
      - NET_RAW    # required for ping
      - NET_ADMIN  # required for mtr / traceroute
    restart: unless-stopped

volumes:
  hopstat-data:
